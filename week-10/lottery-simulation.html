<style>
.lot-sim { font-size:.64em; }
.lot-sim table { width:100%; border-collapse:collapse; font-size:1em; }
.lot-sim th { background:var(--navy); color:white; padding:.35em .5em; text-align:center; }
.lot-sim th:first-child, .lot-sim td:first-child { text-align:left; }
.lot-sim td { padding:.35em .5em; border-bottom:1px solid var(--line); text-align:center; }
.lot-sim td.diff { font-weight:800; color:var(--blue); }
.lot-sim td.gap { font-weight:800; color:var(--rust); }
.lot-sim th.win { background:var(--blue); }
.lot-sim th.lose { background:#4d7f9c; }
.lot-sim th.non { background:var(--muted); }
.lot-sim tr.outcome td { border-top:3px solid var(--navy); font-weight:700; }
.lot-controls { display:flex; gap:.8em; align-items:center; margin-bottom:.45em; }
.lot-controls button { border:2px solid var(--rust); padding:.25em .7em; background:white; color:var(--rust); font:inherit; font-weight:700; cursor:pointer; }
.lot-controls span { color:var(--muted); }
</style>
<script>
(() => {
  const root = document.getElementById('lottery-balance-root');
  if (!root) return;

  const N_APP = 400, N_NON = 2000, SEATS = 200;
  const normal = () => {
    let u = 0, v = 0;
    while (u === 0) u = Math.random();
    while (v === 0) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // latent "family investment" is higher for applicants than for non-applicants
  function person(applicant) {
    const z = normal() + (applicant ? 0.8 : 0);
    return {
      prior: clamp(50 + 9 * z + 6 * normal(), 0, 100),        // 5th-grade test score
      college: Math.random() < 1 / (1 + Math.exp(-(-1.0 + 0.9 * z))), // parent has college degree
      income: Math.max(8, 32 + 9 * z + 7 * normal()),          // family income, $1,000s
      absent: Math.max(0, 9 - 2.2 * z + 2.5 * normal()),        // days absent last year
      y0: clamp(60 + 8 * z + 6 * normal(), 0, 100),              // test score at a regular school
    };
  }

  let applicants = [], non = [], runs = 0;
  function newPeople() {
    applicants = Array.from({ length: N_APP }, () => person(true));
    non = Array.from({ length: N_NON }, () => person(false));
  }

  const rows = [
    ['5th-grade test score', p => p.prior, v => v.toFixed(1)],
    ['Parent has a college degree', p => (p.college ? 100 : 0), v => v.toFixed(0) + '%'],
    ['Family income ($1,000s)', p => p.income, v => v.toFixed(1)],
    ['Days absent last year', p => p.absent, v => v.toFixed(1)],
  ];
  const mean = (arr, f) => arr.reduce((s, p) => s + f(p), 0) / arr.length;
  const sign = v => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(1);

  root.innerHTML = `
    <div class="lot-controls">
      <button type="button" data-run>Run the lottery again</button>
      <span data-runs></span>
    </div>
    <table>
      <thead><tr><th>Measured before the lottery</th><th class="win">Winners</th><th class="lose">Losers</th>
      <th>Winners − losers</th><th class="non">Non-applicants</th><th>Applicants − non-applicants</th></tr></thead>
      <tbody data-body></tbody>
    </table>`;

  function runLottery() {
    runs += 1;
    const order = applicants.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    const winSet = new Set(order.slice(0, SEATS));
    const win = applicants.filter((_, i) => winSet.has(i));
    const lose = applicants.filter((_, i) => !winSet.has(i));
    const body = root.querySelector('[data-body]');
    const allRows = [...rows, ['Score at a regular school (Y₀)', p => p.y0, v => v.toFixed(1), true]];
    body.innerHTML = allRows.map(([label, f, fmt, isOutcome]) => {
      const w = mean(win, f), l = mean(lose, f), a = mean(applicants, f), n = mean(non, f);
      return `<tr class="${isOutcome ? 'outcome' : ''}"><td>${label}</td><td>${fmt(w)}</td><td>${fmt(l)}</td>
        <td class="diff">${sign(w - l)}</td><td>${fmt(n)}</td><td class="gap">${sign(a - n)}</td></tr>`;
    }).join('');
    root.querySelector('[data-runs]').textContent =
      `Lottery #${runs}: ${N_APP} applicants, ${SEATS} seats. Simulated data.`;
  }

  root.querySelector('[data-run]').addEventListener('click', runLottery);
  newPeople();
  runLottery();
})();
</script>
