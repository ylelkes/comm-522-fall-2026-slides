<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --navy:#18324a; --blue:#2f6687; --rust:#b24a3c; --gold:#d5aa55; --ink:#18232d; --paper:#f7f4ee; --muted:#62717d; --line:#c8c2b7; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:transparent; font-family:"Aptos","Helvetica Neue",Arial,sans-serif; color:var(--ink); }
  #nonlinear-plots { display:grid; grid-template-columns:repeat(3,1fr); gap:28px; height:100%; padding:2px 4px 0; }
  figure { margin:0; min-width:0; display:grid; grid-template-rows:auto 1fr; }
  figcaption { font-size:25px; font-weight:700; color:var(--navy); text-align:center; line-height:1.1; }
  figcaption span { display:block; margin-top:5px; font-size:20px; font-weight:600; color:var(--rust); }
  svg { display:block; width:100%; height:100%; overflow:visible; }
  .frame { fill:#fffdfa; stroke:var(--line); stroke-width:2; }
  .axis { stroke:var(--muted); stroke-width:2; }
  .tick { stroke:var(--line); stroke-width:1.5; }
  .point { fill:var(--blue); stroke:#fffdfa; stroke-width:2.5; }
  .curve { fill:none; stroke:var(--gold); stroke-width:5; stroke-linecap:round; opacity:.9; }
  .axis-label { fill:var(--muted); font-size:20px; font-weight:650; }
  @media(max-width:700px) { #nonlinear-plots { grid-template-columns:1fr; overflow:auto; } figure { min-height:330px; } }
</style>
</head>
<body>
<div id="nonlinear-plots" aria-label="Three nonlinear relationships with correlations near zero"></div>
<script>
(() => {
  const root=document.getElementById('nonlinear-plots');
  const NS='http://www.w3.org/2000/svg';
  const xs=Array.from({length:21},(_,i)=>-4+i*.4);
  const datasets=[
    {title:'U-shaped', data:xs.map(x=>({x,y:x*x}))},
    {title:'Inverted U', data:xs.map(x=>({x,y:16-x*x}))},
    {title:'Circular', data:Array.from({length:32},(_,i)=>{const a=2*Math.PI*i/32; return {x:4*Math.cos(a),y:4*Math.sin(a)};})}
  ];
  function el(name,attrs={}) { const n=document.createElementNS(NS,name); Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v)); return n; }
  function corr(data) {
    const mx=data.reduce((s,d)=>s+d.x,0)/data.length, my=data.reduce((s,d)=>s+d.y,0)/data.length;
    const cov=data.reduce((s,d)=>s+(d.x-mx)*(d.y-my),0);
    const sx=Math.sqrt(data.reduce((s,d)=>s+(d.x-mx)**2,0));
    const sy=Math.sqrt(data.reduce((s,d)=>s+(d.y-my)**2,0));
    return cov/(sx*sy);
  }
  datasets.forEach(ds=>{
    const figure=document.createElement('figure');
    const cap=document.createElement('figcaption');
    const r=corr(ds.data);
    cap.innerHTML=`${ds.title}<span>r = ${Math.abs(r)<.005?'0.00':r.toFixed(2)}</span>`;
    const svg=el('svg',{viewBox:'0 0 430 430',role:'img','aria-label':`${ds.title} relationship with correlation ${r.toFixed(2)}`});
    const m={l:58,r:18,t:22,b:54}, w=430-m.l-m.r, h=430-m.t-m.b;
    const xmin=Math.min(...ds.data.map(d=>d.x)), xmax=Math.max(...ds.data.map(d=>d.x));
    const ymin=Math.min(...ds.data.map(d=>d.y)), ymax=Math.max(...ds.data.map(d=>d.y));
    const xp=v=>m.l+(v-xmin)/(xmax-xmin)*w, yp=v=>m.t+(ymax-v)/(ymax-ymin)*h;
    svg.appendChild(el('rect',{x:m.l,y:m.t,width:w,height:h,class:'frame'}));
    const x0=(ymin<=0&&ymax>=0)?yp(0):m.t+h;
    const y0=(xmin<=0&&xmax>=0)?xp(0):m.l;
    svg.appendChild(el('line',{x1:m.l,x2:m.l+w,y1:x0,y2:x0,class:'axis'}));
    svg.appendChild(el('line',{x1:y0,x2:y0,y1:m.t,y2:m.t+h,class:'axis'}));
    const ordered=[...ds.data];
    const path=ordered.map((d,i)=>`${i?'L':'M'} ${xp(d.x)} ${yp(d.y)}`).join(' ')+(ds.title==='Circular'?' Z':'');
    svg.appendChild(el('path',{d:path,class:'curve'}));
    ds.data.forEach(d=>svg.appendChild(el('circle',{cx:xp(d.x),cy:yp(d.y),r:6.5,class:'point'})));
    const xt=el('text',{x:m.l+w/2,y:419,'text-anchor':'middle',class:'axis-label'}); xt.textContent='X'; svg.appendChild(xt);
    const yt=el('text',{x:17,y:m.t+h/2,'text-anchor':'middle',transform:`rotate(-90 17 ${m.t+h/2})`,class:'axis-label'}); yt.textContent='Y'; svg.appendChild(yt);
    figure.append(cap,svg); root.appendChild(figure);
  });
})();
</script>
</body>
</html>
