<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">How moderation can create an association in a surviving archive</title>
  <desc id="desc">Three scatterplots show initially unrelated toxicity and reporting, deletion of posts high on both variables, and a negative relationship among surviving posts.</desc>
  <style>.panel{fill:#fffdf8;stroke:#c8c2b7;stroke-width:3}.axis{stroke:#18324a;stroke-width:3}.grid{stroke:#ddd7cc;stroke-width:1}.pt{fill:#2f6687;opacity:.82}.gone{fill:#b24a3c}.shade{fill:#b24a3c;opacity:.12}.fit{stroke:#b24a3c;stroke-width:6;stroke-dasharray:12 8}.head{font:700 27px Arial,sans-serif;fill:#18324a}.small{font:20px Arial,sans-serif;fill:#526572}.axislabel{font:700 19px Arial,sans-serif;fill:#18324a}.callout{font:700 20px Arial,sans-serif;fill:#b24a3c}</style>
  <defs><g id="points"><circle class="pt" cx="45" cy="245" r="8"/><circle class="pt" cx="50" cy="175" r="8"/><circle class="pt" cx="58" cy="105" r="8"/><circle class="pt" cx="68" cy="55" r="8"/><circle class="pt" cx="105" cy="215" r="8"/><circle class="pt" cx="112" cy="145" r="8"/><circle class="pt" cx="118" cy="78" r="8"/><circle class="pt" cx="165" cy="255" r="8"/><circle class="pt" cx="170" cy="185" r="8"/><circle class="pt" cx="178" cy="118" r="8"/><circle class="pt" cx="185" cy="48" r="8"/><circle class="pt" cx="225" cy="225" r="8"/><circle class="pt" cx="235" cy="155" r="8"/><circle class="pt" cx="242" cy="88" r="8"/><circle class="pt" cx="280" cy="265" r="8"/><circle class="pt" cx="292" cy="195" r="8"/><circle class="gone" cx="300" cy="125" r="9"/><circle class="gone" cx="308" cy="58" r="9"/><circle class="pt" cx="342" cy="235" r="8"/><circle class="pt" cx="350" cy="170" r="8"/><circle class="gone" cx="360" cy="98" r="9"/><circle class="gone" cx="370" cy="42" r="9"/></g></defs>
  <g transform="translate(15 10)"><rect class="panel" width="465" height="445" rx="16"/><text class="head" x="30" y="43">1. All posts users produced</text><text class="small" x="30" y="72">No underlying relationship</text><g transform="translate(45 105)"><line class="axis" x1="0" y1="290" x2="395" y2="290"/><line class="axis" x1="0" y1="290" x2="0" y2="0"/><use href="#points"/><text class="axislabel" x="145" y="325">Toxicity →</text><text class="axislabel" transform="translate(-28 205) rotate(-90)">Reports →</text></g></g>
  <g transform="translate(518 10)"><rect class="panel" width="465" height="445" rx="16"/><text class="head" x="30" y="43">2. Platform moderates</text><text class="small" x="30" y="72">High toxicity + many reports → removal</text><g transform="translate(45 105)"><line class="axis" x1="0" y1="290" x2="395" y2="290"/><line class="axis" x1="0" y1="290" x2="0" y2="0"/><rect class="shade" x="265" y="0" width="130" height="145"/><use href="#points"/><path d="M291 116 l18 18 m0-18 l-18 18 M299 49 l18 18 m0-18 l-18 18 M351 89 l18 18 m0-18 l-18 18 M361 33 l18 18 m0-18 l-18 18" stroke="#fff" stroke-width="4"/><text class="callout" x="265" y="165">removed</text><text class="axislabel" x="145" y="325">Toxicity →</text><text class="axislabel" transform="translate(-28 205) rotate(-90)">Reports →</text></g></g>
  <g transform="translate(1021 10)"><rect class="panel" width="465" height="445" rx="16"/><text class="head" x="30" y="43">3. Researcher sees survivors</text><text class="small" x="30" y="72">A negative association appears</text><g transform="translate(45 105)"><line class="axis" x1="0" y1="290" x2="395" y2="290"/><line class="axis" x1="0" y1="290" x2="0" y2="0"/><circle class="pt" cx="45" cy="245" r="8"/><circle class="pt" cx="50" cy="175" r="8"/><circle class="pt" cx="58" cy="105" r="8"/><circle class="pt" cx="68" cy="55" r="8"/><circle class="pt" cx="105" cy="215" r="8"/><circle class="pt" cx="112" cy="145" r="8"/><circle class="pt" cx="118" cy="78" r="8"/><circle class="pt" cx="165" cy="255" r="8"/><circle class="pt" cx="170" cy="185" r="8"/><circle class="pt" cx="178" cy="118" r="8"/><circle class="pt" cx="185" cy="48" r="8"/><circle class="pt" cx="225" cy="225" r="8"/><circle class="pt" cx="235" cy="155" r="8"/><circle class="pt" cx="242" cy="88" r="8"/><circle class="pt" cx="280" cy="265" r="8"/><circle class="pt" cx="292" cy="195" r="8"/><circle class="pt" cx="342" cy="235" r="8"/><circle class="pt" cx="350" cy="170" r="8"/><line class="fit" x1="35" y1="105" x2="365" y2="245"/><text class="axislabel" x="145" y="325">Toxicity →</text><text class="axislabel" transform="translate(-28 205) rotate(-90)">Reports →</text></g></g>
</svg>
